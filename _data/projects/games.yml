- title: "Sky Oceans: Wings for Hire"
  project_description: >
    This game is a homage to JRPG classics! Take the role of a captune and
    unite a party of rag-tag sky prites setting upon an unforgettable,
    touching journey.
  description: >
    Led the 6-month port of a Unity RPG game from Nintendo Switch to Android.
    Rebuilt the audio pipeline on mobile FMOD banks, converted 5100+ textures
    to ASTC with custom tooling, and compiled over 1,000 debug logs out of
    release builds with a custom logger. The game landed inside a 1.5 GB
    budget on 4 GB devices. Delivered a ground-up touch control layer across
    30+ UI screens at a stable 30 FPS on target devices.
  image: assets/images/p_skyoceans.gif
  url: https://store.steampowered.com/app/1691750/Sky_Oceans_Wings_for_Hire/
  studio: octeto
  release: Jul 2026
  engines: [unity]
  languages: [csharp]
  tags: [3D, Turn-Based, JRPG]
  platforms:
