- title: NBA Clash
  project_description: >
    A fast-paced, real-time 3v3 mobile basketball game where you build a squad
    of NBA stars, swipe and tap to score, and aim to be the first to 11 points.
  description: >
    Integrated SDKs and analytics to cut build time from 7 days to 2. Debugged
    multiplayer systems to improve match stability and sync. Coordinated
