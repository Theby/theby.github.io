- title: Cross Winds
  project_description: >
    A romantic adventure set in the skies. Explore a wonderful archipielago,
    meet new people and follow hidden letters to reunite with your beloved.
  description: >
    Rebuilt the quest system for designers to author main and side quests entirely in the
    inspector, with optional objectives, tasks, unlock order, conditions, and more.
    Also added state-machine camera rig (spyglass, tagging, free/fixed) and responsive HUD framework.
    Refactor the cinematic and story flow systems for iteration on the integration of the game demo.
  image: assets/images/p_crosswinds.gif
