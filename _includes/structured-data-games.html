{% comment %}
  Schema.org JSON-LD for published games (homepage only).
  Emitted as an ItemList of VideoGame entries from _data/projects.yml.
  jekyll-seo-tag handles Person/WebPage/BlogPosting; this covers the games it can't.
{% endcomment %}
{% if page.pageType == "projects" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {% for item in site.data.projects %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "VideoGame",
        "name": {{ item.title | jsonify }},
        "description": {{ item.project_description | strip_newlines | strip | jsonify }},
        "url": {{ item.url | jsonify }},
        "image": "{{ site.url }}/{{ item.image }}",
        "author": { "@type": "Person", "name": "{{ site.author.name }}" }
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
